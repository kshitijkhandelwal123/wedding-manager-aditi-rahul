<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Manager · The Wedding Scrippt</title>
<meta name="description" content="Private wedding manager — guests, travel, stay, transport, events, catering, budget and shagun in one place. Crafted by The Wedding Scrippt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* =========================================================
   THEME — change colours & fonts here
   ========================================================= */
:root{
  --blush:#FCF6F3;   /* page background */
  --paper:#FFFFFF;   /* cards */
  --petal:#F8E6E3;   /* soft pink tint */
  --rose:#C9707A;    /* rose pink */
  --rose-l:#F4C9CF;
  --wine:#8E2F44;    /* primary maroon */
  --wine-d:#6B1F32;  /* deep maroon */
  --ink:#3B2026;     /* text */
  --muted:#8C7075;
  --line:#EFDFDA;
  --gold:#B8935A;    /* accents */
  --gold-l:#F3E6D0;
  --sky:#EDE7F1;     /* soft lilac for info badges */
  --shadow:0 14px 36px -18px rgba(110,31,51,.28);
  --r:16px;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,-apple-system,sans-serif;
  --script:'Pinyon Script','Cormorant Garamond',cursive;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--blush);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.serif{font-family:var(--serif)}
.script{font-family:var(--script);font-weight:400}
.dim{color:#C9B7B9}
.hidden{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kicker{letter-spacing:.32em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.mono{font-family:var(--serif);font-style:italic;font-weight:400;line-height:1;color:var(--wine)}
.mono b{font-family:var(--script);font-style:normal;font-weight:400;color:var(--gold);font-size:.62em;margin:0 .12em;vertical-align:.12em}

/* ornament */
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold);margin:16px auto}
.orn span{height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.orn i{width:7px;height:7px;border:1px solid var(--gold);transform:rotate(45deg)}

/* ---------- landing ---------- */
.landing{min-height:100vh;position:relative;overflow:hidden;display:grid;place-items:center;padding:56px 16px 40px;
  background:radial-gradient(900px 520px at 12% 0%,#FBE1E2 0,transparent 62%),radial-gradient(820px 560px at 100% 100%,#F5DCD2 0,transparent 60%),var(--blush);background-size:cover;background-position:center}
.landing.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(252,246,243,.86),rgba(252,246,243,.93))}
.corner{position:absolute;width:min(36vw,310px);color:var(--rose);opacity:.5;pointer-events:none}
.corner.tl{top:-8px;left:-8px}.corner.tr{top:-8px;right:-8px;transform:scaleX(-1)}
.corner.bl{bottom:-8px;left:-8px;transform:scaleY(-1)}.corner.br{bottom:-8px;right:-8px;transform:rotate(180deg)}
.land{position:relative;z-index:1;text-align:center;width:100%;max-width:720px}
.land .mono{font-size:clamp(78px,12vw,128px);margin:8px 0 2px}
.land h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4.4vw,44px);margin:0;letter-spacing:.01em}
.land .meta{color:var(--muted);margin-top:6px;letter-spacing:.06em}
.cd{display:flex;justify-content:center;gap:clamp(8px,2.4vw,18px);margin-top:4px}
.cd div{width:clamp(66px,15vw,84px);padding:12px 0 10px;border:1px solid var(--gold-l);border-radius:14px;background:rgba(255,255,255,.6)}
.cd strong{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(26px,5vw,34px);line-height:1;color:var(--wine)}
.cd small{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:540px;margin:30px auto 0}
.arch{position:relative;border-radius:220px 220px 20px 20px;border:1px solid var(--line);background:rgba(255,255,255,.78);padding:46px 16px 24px;cursor:pointer;transition:.25s;text-align:center}
.arch::before{content:"";position:absolute;inset:7px;border-radius:inherit;border:1px solid var(--gold-l);pointer-events:none}
.arch:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.arch.on{border-color:var(--wine);box-shadow:0 18px 40px -20px rgba(110,31,51,.5)}
.arch .script{font-size:30px;color:var(--rose);line-height:1}
.arch strong{display:block;font-family:var(--serif);font-weight:500;font-size:26px;color:var(--wine);margin-top:4px}
.arch small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.pinbox{max-width:440px;margin:18px auto 0;padding:16px;border-radius:18px;background:rgba(255,255,255,.85);border:1px solid var(--line);animation:rise .3s ease}
.pinbox form{display:flex;gap:8px}
.pinbox input{flex:1;text-align:center;letter-spacing:.35em}
.pinbox p{margin:8px 0 0;font-size:12px;color:var(--muted)}
.guestbtn{margin-top:22px;display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:999px;border:0;cursor:pointer;color:#fff;font-size:15px;letter-spacing:.04em;
  background:linear-gradient(135deg,#D8848F,#A23C55 55%,#8E2F44);box-shadow:0 16px 30px -14px rgba(142,47,68,.7);transition:.2s}
.guestbtn:hover{transform:translateY(-2px)}
.brandline{margin-top:26px;font-size:12px;color:var(--muted)}
.brandline a{color:var(--wine);text-decoration:none;border-bottom:1px solid var(--gold-l)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- form controls ---------- */
.in,select.in,textarea.in{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#FFFCFB;outline:none;transition:.15s}
.in:focus{border-color:var(--rose);background:#fff;box-shadow:0 0 0 3px rgba(201,112,122,.18)}
.in:disabled{background:#F6EFED;color:var(--muted)}
textarea.in{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:.04em;color:var(--muted)}
label.f.wide{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink);cursor:pointer;background:#FFFCFB}
.checks input,.tog input{accent-color:var(--wine)}
.tog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);cursor:pointer}
.tog input{width:18px;height:18px;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:14px;white-space:nowrap;transition:.15s;text-decoration:none}
.btn:hover{border-color:var(--rose)}
.btn.pri{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn.pri:hover{background:var(--wine-d)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{color:#9C3B45;border-color:#F0D2D2}
.btn.wa{color:#1F7A4D;border-color:#CDE9D9}
.ic{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);text-decoration:none}
.ic:hover{background:var(--petal);color:var(--wine)}
.ic.wa:hover{background:#E3F4EA;color:#1F7A4D}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:254px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,#FFFAF8,#F7E5E1);border-right:1px solid var(--line);padding:26px 14px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .sm-mono{font-size:42px;text-align:center}
.side .sm-meta{text-align:center;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:8px 0 18px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-radius:12px;background:transparent;color:#6E3B47;cursor:pointer;text-align:left;font-size:14px}
.nav button:hover{background:rgba(142,47,68,.06)}
.nav button.on{background:var(--wine);color:#fff;box-shadow:0 10px 20px -12px rgba(110,31,51,.7)}
.nav .lk{margin-left:auto;width:14px;height:14px;opacity:.55}
.side .who{margin-top:12px;padding:12px;border-radius:14px;background:rgba(142,47,68,.06);font-size:12px;color:var(--muted)}
.side .who strong{color:var(--wine);font-weight:500;font-size:13px}
.side .who .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side .who .btn{margin-top:8px;width:100%;justify-content:center}
.side .credit{margin-top:12px;text-align:center;font-size:11px;color:var(--muted)}
.side .credit a{color:var(--wine);text-decoration:none}
.side .mob-out{display:none}
.main{padding:30px clamp(16px,3vw,40px) 60px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.2vw,40px);margin:0;line-height:1.1}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.role-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--gold-l);color:#7A5E31;font-size:11px;letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.role-pill svg{width:13px;height:13px}

/* ---------- banner ---------- */
.banner{position:relative;border-radius:24px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;padding:26px 28px;color:#fff;margin-bottom:22px;
  background:linear-gradient(125deg,#D1868F,#A23C55 50%,#7A2639);background-size:cover;background-position:center;box-shadow:var(--shadow)}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 15%,rgba(74,18,32,.62))}
.banner .bfl{position:absolute;right:-20px;top:-20px;width:220px;color:#fff;opacity:.2}
.banner > *{position:relative}
.banner h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4vw,46px);margin:0;line-height:1}
.banner .bmeta{opacity:.92;margin-top:6px;font-size:14px;letter-spacing:.04em}
.banner .days{margin-left:auto;text-align:right}
.banner .days strong{font-family:var(--serif);font-size:56px;font-weight:500;line-height:1;display:block}
.banner .days small{letter-spacing:.24em;text-transform:uppercase;font-size:11px;opacity:.85}
.bwrap{display:flex;align-items:flex-end;gap:20px;width:100%;flex-wrap:wrap}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(178px,1fr));margin-bottom:22px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px}
.kpi .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .lbl svg{color:var(--gold)}
.kpi .val{font-family:var(--serif);font-size:36px;font-weight:500;line-height:1.1;margin-top:8px;color:var(--ink)}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.accent{background:linear-gradient(150deg,#fff,#FBE9E8)}
.cols{grid-template-columns:1.25fr 1fr}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h3 small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400;margin-left:auto}
.card h3 svg{color:var(--gold)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500}
.li .s{font-size:12.5px;color:var(--muted)}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--petal);color:var(--wine);flex:none}
.bar{height:9px;border-radius:999px;background:var(--petal);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--wine));border-radius:999px}
.bar.gold i{background:linear-gradient(90deg,var(--gold-l),var(--gold))}
.empty{padding:34px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}

/* ---------- toolbar / table ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .in{padding-left:38px;border-radius:999px;background:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:13px}
.chip.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.tablewrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{position:sticky;top:0;background:#FFF9F7;text-align:left;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #F5EAE7;vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FFFAF9}
td.act{white-space:nowrap;text-align:right;width:1%}
td:first-child{font-weight:500}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--petal);font-size:12px;margin:1px 2px 1px 0;color:var(--wine)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:#F1E9E4;color:#6B4D45;white-space:nowrap}
.b-confirmed,.b-fully-paid,.b-done,.b-given,.b-allocated,.b-collected,.b-set{background:#E6F1EA;color:#2F6B4A}
.b-pending,.b-to-do,.b-unpaid,.b-medium,.b-advance-paid,.b-needed{background:var(--gold-l);color:#7D6036}
.b-declined,.b-high,.b-off{background:#F9DEDF;color:#93323F}
.b-tentative,.b-in-progress,.b-on-duty,.b-checked-in{background:var(--sky);color:#5E4C78}
.b-low,.b-checked-out,.b-own{background:#F3EEEC;color:#7C6E6A}
.b-bride{background:#FBE3E7;color:#A23C55}.b-groom{background:#E9E5F3;color:#55467A}.b-shared{background:#F3EEEC;color:#7C6E6A}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.mode svg{width:15px;height:15px;color:var(--gold)}

/* ---------- travel board ---------- */
.day{margin-bottom:22px}
.day h4{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.day h4 span{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 16px;position:relative}
.tc .time{font-family:var(--serif);font-size:24px;line-height:1;color:var(--wine)}
.tc .nm{font-weight:500;margin-top:6px}
.tc .ln{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:3px}
.tc .ln svg{width:14px;height:14px}
.tc .flag{position:absolute;top:14px;right:14px;display:flex;gap:4px}
.tc.warn{border-color:#EBCB9E;background:linear-gradient(180deg,#fff,#FFF8EC)}
.tc .acts{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- events ---------- */
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:22px}
.ev{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.ev::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#FAD9DD,transparent 70%)}
.ev > *{position:relative;z-index:1}
.ev .d{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.ev h5{font-family:var(--serif);font-size:28px;font-weight:500;margin:6px 0 8px;line-height:1;color:var(--wine)}
.ev .ln{font-size:13px;color:var(--muted)}

/* ---------- guest portal ---------- */
.pbg{min-height:100vh;background:radial-gradient(900px 500px at 0% 0%,#FADDE1 0,transparent 60%),radial-gradient(900px 600px at 100% 40%,#F9E3DA 0,transparent 60%),#FDF3F2}
.portal{max-width:880px;margin:0 auto}
.pcover{border-radius:30px;overflow:hidden;min-height:380px;position:relative;display:grid;place-items:center;text-align:center;color:#fff;padding:74px 24px 56px;margin-bottom:22px;
  background:linear-gradient(155deg,#EDA8B2,#CB6C7F 40%,#9B3550 80%,#7A2639);background-size:cover;background-position:center;box-shadow:0 30px 60px -30px rgba(122,38,57,.6)}
.pcover.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(122,38,57,.35),rgba(90,22,40,.7))}
.pcover > *{position:relative;z-index:2}
.pcover > .toran{position:absolute;top:0;left:0;right:0;height:34px;z-index:3;
  background:radial-gradient(circle at 50% 21px,#F5DEA6 3px,transparent 4px) 0 0/34px 34px repeat-x,
             radial-gradient(circle at 50% 0,#F6B04F 10px,transparent 11px) 17px 0/34px 34px repeat-x,
             radial-gradient(circle at 50% 0,#FCE3E8 16px,transparent 17px) 0 0/34px 34px repeat-x}
.pcover > .pfl{position:absolute;width:190px;color:#fff;opacity:.28;z-index:1}
.pcover > .pfl.l{left:-14px;bottom:-14px;transform:scaleY(-1)}
.pcover > .pfl.r{right:-14px;bottom:-14px;transform:rotate(180deg)}
.pcover .script{font-size:clamp(36px,6vw,52px);line-height:1;color:#FFE9EC}
.pcover .mono{color:#fff;font-size:clamp(64px,10vw,96px);margin:6px 0 4px}
.pcover .mono b{color:#F5DEA6}
.pcover h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,40px);margin:0}
.pcover p{margin:6px 0 0;opacity:.95;letter-spacing:.05em}
.pcover .pdays{display:inline-block;margin-top:16px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.pcover > .petal{position:absolute;top:-24px;width:12px;height:16px;border-radius:12px 0 12px 0;background:rgba(255,228,233,.9);z-index:1;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(440px) rotate(340deg);opacity:0}}
.wcard{text-align:center;padding:28px 24px;background:linear-gradient(180deg,#fff,#FFF5F5);border:1px solid #F3D6D9}
.wcard .script{font-size:36px;color:var(--rose);line-height:1}
.wcard p{font-family:var(--serif);font-size:21px;margin:8px auto 0;max-width:600px;color:var(--ink)}
.ptitle{text-align:center;margin:30px 0 14px}
.ptitle .script{font-size:34px;color:var(--rose);line-height:1;display:block}
.ptitle h3{font-family:var(--serif);font-weight:500;font-size:32px;margin:2px 0 0;color:var(--wine)}
.pform{border-color:#F3D6D9;background:linear-gradient(180deg,#fff,#FFF8F8)}
.pform .sec{color:var(--rose)}
.thanks{padding:50px 24px}
.thanks .script{font-size:56px}

/* confetti */
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.popper{position:fixed;bottom:14px;z-index:71;pointer-events:none;font-size:clamp(46px,9vw,72px);line-height:1}
.popper.l{left:14px}.popper.r{right:14px;transform:scaleX(-1)}
.popper span{display:block;animation:pop 1.8s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}20%{transform:scale(1.2) rotate(6deg);opacity:1}35%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1) translateY(10px)}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(59,32,38,.42);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.panel{width:100%;max-width:780px;max-height:92vh;overflow:auto;background:var(--blush);border-radius:22px;box-shadow:0 40px 90px -30px rgba(0,0,0,.45)}
.panel.sm{max-width:420px}
.panel header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--blush);z-index:1}
.panel header h3{font-family:var(--serif);font-size:28px;font-weight:500;margin:0;color:var(--wine);display:flex;align-items:center;gap:10px}
.panel header h3 svg{width:22px;height:22px;color:var(--gold)}
.panel .body{padding:8px 24px 10px}
.panel footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--blush)}
.sec{margin:18px 0 8px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.locks{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;gap:8px 12px;align-items:center}
.locks .h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.locks .nm{font-weight:500;display:flex;align-items:center;gap:8px}
.locks .nm svg{color:var(--gold)}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--wine-d);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--shadow);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:20;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .side .top{display:flex;align-items:center;justify-content:space-between}
  .side .sm-mono{font-size:30px;text-align:left}
  .side .sm-meta,.side .credit,.side .who{display:none}
  .side .mob-out{display:inline-grid}
  .nav{flex-direction:row;overflow-x:auto;margin-top:8px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:none;padding:8px 12px;font-size:13px}
  .cols{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .locks{grid-template-columns:1fr 1fr}
  .locks .nm{grid-column:1/-1;margin-top:8px}
  .locks .h{display:none}
  .main{padding-top:20px}
}
@media (max-width:520px){
  .sides{gap:10px}
  .arch{padding:36px 10px 18px}
  .arch strong{font-size:21px}
  .arch .script{font-size:24px}
  .banner{padding:20px}
  .banner .days{margin-left:0;text-align:left}
  .pinbox form{flex-direction:column}
  .guestbtn{padding:13px 20px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){.pcover > .petal{display:none}.popper span,.pinbox{animation:none}}
@media print{.side,.toolbar,.ph .acts,td.act{display:none!important}.shell{display:block}}

function fmtT(v){ if(!v) return ''; const [h,m]=v.split(':'); const d=new Date(); d.setHours(+h,+m); return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}); }

function fmt(f,v){
  if(v==null || v==='' || (Array.isArray(v)&&!v.length)) return '<span class="dim">—</span>';
  switch(f.t){
    case 'money': return inr(v);
    case 'datetime-local': return fmtDT(v);
    case 'date': return fmtD(v);
    case 'time': return fmtT(v);
    case 'multi': return v.map(x=>`<span class="tag">${esc(x)}</span>`).join('');
    case 'textarea': { const s=String(v); return esc(s.length>70?s.slice(0,70)+'…':s); }
    case 'select':
      if(f.k==='side') return `<span class="badge b-${slug(v)}">${sideLabel(v)}</span>`;
      if(f.badge) return `<span class="badge b-${slug(v)}">${esc(v)}</span>`;
      if(f.o===MODES) return modeChip(v);
      return esc(v);
  }
  return esc(v);
}

function fieldInput(f, v, opts){
  const req = f.req ? 'required' : '';
  const ph = f.ph ? `placeholder="${esc(f.ph)}"` : '';
  if(f.k==='side'){
    if(opts.portal) return `<select class="in" name="side" required><option value="">—</option>${SIDE2.map(o=>`<option value="${o}">Guest of ${esc(sideName(o))}'s family</option>`).join('')}</select>`;
    if(f.o===SIDE2) return `<select class="in" name="side" disabled><option>${esc(sideName(v||side()))}'s side</option></select>`;
    return `<select class="in" name="side">${['Shared',side()].map(o=>`<option value="${o}" ${o===v?'selected':''}>${o==='Shared'?'Shared by both families':esc(sideName(o))+"'s side only"}</option>`).join('')}</select>`;
  }
  const val = v==null ? '' : v;
  switch(f.t){
    case 'select': return `<select class="in" name="${f.k}" ${req}><option value="">—</option>${f.o.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    case 'ref': { const list=(f.src==='guests'?visibleGuests():(S[f.src]||[])).map(x=>x.name).filter(Boolean); return `<select class="in" name="${f.k}" ${req}><option value="">—</option>${list.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }
    case 'multi': { const list=(S[f.src]||[]).map(x=>x.name); const arr=Array.isArray(val)?val:[]; return `<div class="checks">${list.map(o=>`<label><input type="checkbox" name="${f.k}" value="${esc(o)}" ${arr.includes(o)?'checked':''}>${esc(o)}</label>`).join('')||'<span class="dim">Add events first</span>'}</div>`; }
    case 'textarea': return `<textarea class="in" name="${f.k}" ${ph}>${esc(val)}</textarea>`;
    case 'money': return `<input class="in" type="number" min="0" step="1" name="${f.k}" value="${esc(val)}" ${ph}>`;
    case 'number': return `<input class="in" type="number" min="0" name="${f.k}" value="${esc(val)}" ${req}>`;
    default: return `<input class="in" type="${f.t}" name="${f.k}" value="${esc(val)}" ${req} ${ph}>`;
  }
}
function fieldsHTML(fields, rec, opts={}){
  let html='', open=false;
  fields.forEach(f=>{
    if(f.sec){ if(open) html+='</div>'; html+=`<div class="sec">${opts.portal&&f.sec==='Guest details'?'About you':f.sec}</div><div class="fgrid">`; open=true; }
    if(!open){ html+='<div class="fgrid">'; open=true; }
    const label = opts.portal&&f.k==='side' ? 'You are invited by *' : f.l+(f.req?' *':'');
    html += `<label class="f ${f.wide||f.t==='multi'?'wide':''}">${label}${fieldInput(f, rec[f.k], opts)}</label>`;
  });
  if(open) html+='</div>';
  return html;
}
function collect(form, fields){
  const o={};
  fields.forEach(f=>{
    if(f.t==='multi'){ o[f.k]=[...form.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>i.value); return; }
    const el=form.elements[f.k]; if(!el || el.disabled) return;
    let v=el.value.trim();
    if((f.t==='number'||f.t==='money') && v!=='') v=Number(v);
    o[f.k]=v;
  });
  return o;
}

/* keep rooms, transport & events in sync with guest records */
function syncAfter(mod, rec){
  if(mod==='rooms' && rec.guest){ const g=S.guests.find(x=>x.name===rec.guest); if(g){ g.hotel=rec.hotel; g.room=rec.roomNo; } if(!rec.status||rec.status==='Available') rec.status='Allocated'; }
  if(mod==='fleet' && rec.assignedTo){ const g=S.guests.find(x=>x.name===rec.assignedTo); if(g){ g.driver=rec.driver; g.carNo=rec.carNo; g.driverPhone=rec.driverPhone; } }
  if(mod==='events' && rec._oldName && rec._oldName!==rec.name){ const o=rec._oldName, n=rec.name;
    S.guests.forEach(g=>{ if(Array.isArray(g.events)) g.events=g.events.map(e=>e===o?n:e); });
    S.menu.forEach(m=>{ if(m.event===o) m.event=n; }); S.shagun.forEach(m=>{ if(m.event===o) m.event=n; }); }
  delete rec._oldName;
}

/* =========================================================
   CONFETTI — party popper for the guest portal
   ========================================================= */
function popConfetti(){
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  document.querySelectorAll('.confetti,.popper').forEach(n=>n.remove());
  ['l','r'].forEach(sd=>{ const p=document.createElement('div'); p.className='popper '+sd; p.innerHTML='<span>🎉</span>'; document.body.appendChild(p); setTimeout(()=>p.remove(),1900); });
  const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  const dpr=Math.min(2,window.devicePixelRatio||1), W=innerWidth, H=innerHeight; c.width=W*dpr; c.height=H*dpr;
  const x=c.getContext('2d'); if(!x){ c.remove(); return; } x.scale(dpr,dpr);
  const cols=['#F4B6C2','#E8899A','#C2566E','#8E2F44','#D4AF6A','#F3DDA8','#FFFFFF','#F7A8B8'];
  const ps=[], n=Math.min(240,Math.round(W/4)+90), base=Math.max(14,H*0.021);
  for(let i=0;i<n;i++){
    const left=i%2===0, a=(52+Math.random()*30)*Math.PI/180, v=base+Math.random()*base*0.65;
    ps.push({x:left?24:W-24,y:H-40,vx:(left?1:-1)*Math.cos(a)*v,vy:-Math.sin(a)*v,w:5+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.35,
      c:cols[i%cols.length],round:Math.random()<.3,ph:Math.random()*6,delay:Math.floor(Math.random()*10)});
  }
  let f=0;
  (function frame(){
    f++; x.clearRect(0,0,W,H); let alive=0;
    ps.forEach(p=>{
      if(f<p.delay){ alive++; return; }
      p.vx*=0.985; p.vy=p.vy*0.985+0.32; p.x+=p.vx+(p.vy>0?Math.sin(f*0.08+p.ph)*0.8:0); p.y+=p.vy; p.r+=p.vr;
      if(p.y<H+20){ alive++;
        x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.globalAlpha=f>200?Math.max(0,1-(f-200)/60):1;
        if(p.round){ x.beginPath(); x.arc(0,0,p.w/2.4,0,6.283); x.fill(); } else x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(f*0.1+p.ph))+1);
        x.restore(); }
    });
    if(alive && f<260) requestAnimationFrame(frame); else c.remove();
  })();
}

const hasXLSX = () => { if(typeof XLSX==='undefined'){ toast('Excel tools need an internet connection — please reload'); return false; } return true; };
function toSheetRows(mod, data){
  const fields=MODS[mod].fields;
  return data.map(r=>{ const o={}; fields.forEach(f=>{ let v=r[f.k]; if(Array.isArray(v)) v=v.join(', '); o[f.l]=v==null?'':v; }); return o; });
}
const fileBase = () => slug(`${S.settings.bride}-${S.settings.groom}-${side()||'guest'}`);
function exportMod(mod){
  if(!hasXLSX()) return;

  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,MODS[mod].title.slice(0,30));
  XLSX.writeFile(wb,`${fileBase()}-${mod}.xlsx`);
}
function exportAll(){

function exportTravel(){

function template(mod){

  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,MODS[mod].title.slice(0,30)); XLSX.writeFile(wb,`${mod}-template.xlsx`);
}
const pad = n => String(n).padStart(2,'0');
function normVal(f,v){
  if(v==null || v==='') return '';
  if(v instanceof Date){ if(f.t==='date') return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`; if(f.t==='datetime-local') return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}T${pad(v.getHours())}:${pad(v.getMinutes())}`; if(f.t==='time') return `${pad(v.getHours())}:${pad(v.getMinutes())}`; return v.toLocaleString(); }
  if(f.t==='multi') return String(v).split(/[,;]/).map(x=>x.trim()).filter(Boolean);
  if(f.t==='number'||f.t==='money'){ const n=Number(String(v).replace(/[₹,\s]/g,'')); return isNaN(n)?'':n; }
  if(f.t==='select'){ const m=f.o.find(o=>o.toLowerCase()===String(v).trim().toLowerCase()); return m||String(v).trim(); }
  return String(v).trim();
}
function importFile(mod, file){
  if(!hasXLSX()) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{
    const wb=XLSX.read(fr.result,{type:'array',cellDates:true});
    const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const fields=MODS[mod].fields.filter(f=>f.k!=='side'); let n=0;
    json.forEach(row=>{
      const lk={}; Object.keys(row).forEach(k=>lk[k.trim().toLowerCase()]=row[k]);
      const rec={id:uid()};
      fields.forEach(f=>{ const v=lk[f.l.toLowerCase()] ?? lk[f.k.toLowerCase()]; const nv=normVal(f,v); if(nv!=='' && !(Array.isArray(nv)&&!nv.length)) rec[f.k]=nv; });
      if(fields.filter(f=>f.req).some(f=>!rec[f.k])) return;
      if(MODS[mod].fields.some(f=>f.k==='side')) rec.side = (mod==='guests'||mod==='shagun') ? side() : defaultSide(mod);
      if(mod==='guests'){ rec.rsvp=rec.rsvp||'Pending'; rec.events=rec.events||[]; }
      S[mod].push(rec); syncAfter(mod,rec); n++;
    });
    save(); render(); toast(n?`Imported ${n} ${n>1?'rows':'row'}`:'No matching rows found — use the template headers');
  }catch(e){ toast('Could not read that file'); } };
  fr.readAsArrayBuffer(file);
}
function readImage(file, cb){
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,1800/img.width); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.82)); }; img.src=fr.result; };
  fr.readAsDataURL(file);
}

document.addEventListener('click', e=>{

    case 'approve': { const p=S.pending.find(x=>x.id===id); if(p){ const g=Object.assign({},p,{id:uid(),rsvp:'Confirmed',idProof:'Pending',welcomeKit:'Not given'}); delete g.submittedAt; S.guests.push(g); S.pending=S.pending.filter(x=>x.id!==id); save(); render(); toast(`${g.name} added to the guest list`); } break; }
    case 'discard': if(confirm('Discard this reply?')){ S.pending=S.pending.filter(x=>x.id!==id); save(); render(); } break;

    case 'exportAll': exportAll(); break;
    case 'exportTravel': exportTravel(); break;

/* Forms are handled in script (not native submit) so they also work
   inside sandboxed previews that block form submission. */
document.addEventListener('submit', e=>{ if(e.target.dataset.form){ e.preventDefault(); handleForm(e.target); } });
document.addEventListener('click', e=>{
  const b=e.target.closest('button[type="submit"]'); if(!b) return;
  const f=b.closest('form[data-form]'); if(!f) return;
  e.preventDefault(); handleForm(f);
}, true);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); return; }
  if(e.key!=='Enter' || e.target.tagName==='TEXTAREA' || e.target.tagName==='BUTTON') return;
  const f=e.target.closest && e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault(); handleForm(f);
});
function handleForm(f){
  const kind=f.dataset.form; if(!kind) return;
  if(f.checkValidity && !f.checkValidity()){ if(f.reportValidity) f.reportValidity(); toast('Please fill the required fields'); return; }
  if(kind==='pin'){
    const v=$('#pinIn').value.trim(), sd=ui.pinFor==='bride'?'Bride':'Groom', a=S.settings.access[sd];
    if(v===String(a.owner)) setRole(ui.pinFor,true);
    else if(v===String(a.family)) setRole(ui.pinFor,false);
    else { toast('That PIN doesn’t match'); $('#pinIn').value=''; }
    return;
  }
  if(kind==='unlock'){
    const sec=f.dataset.sec, v=$('#unlockIn').value.trim(), a=acc();
    if(v===String(a.owner)){ ui.owner=true; saveSession(); closeModal(); if(sec!=='owner') view=sec; render(); toast('Owner access unlocked'); return; }
    if(sec!=='owner' && lockOf(sec)==='pin' && v && v===String((a.pins||{})[sec])){ ui.unlocked.push(sec); saveSession(); closeModal(); view=sec; render(); return; }
    toast('That password doesn’t match'); $('#unlockIn').value=''; return;
  }
  if(kind==='crud'){
    const mod=f.dataset.mod, id=f.dataset.id, fields=MODS[mod].fields;
    const data=collect(f,fields);
    let rec;
    if(id){ rec=S[mod].find(x=>x.id===id); if(mod==='events') data._oldName=rec.name; Object.assign(rec,data); }
    else { if(mod==='guests'||mod==='shagun') data.side=side(); rec=Object.assign({id:uid()},data); S[mod].push(rec); }
    syncAfter(mod,rec); save(); closeModal(); render(); toast('Saved'); return;
  }
  if(kind==='portal'){
    const flds=PORTAL_FIELDS.map(k=>MODS.guests.fields.find(x=>x.k===k));
    const data=collect(f,flds); if(!data.name){ toast('Please add your name'); return; }
    S.pending.push(Object.assign({id:uid(),submittedAt:new Date().toISOString()},data)); save();
    if(role==='guest'){ ui.portalDone=true; render(); window.scrollTo(0,0); setTimeout(popConfetti,150); }
    else { render(); toast(`Test reply sent — see ${sideName(data.side)}'s Guest List`); }
    return;
  }
  if(kind==='settings'){
    const s=S.settings, a=acc(), fd=new FormData(f);
    const fam=String(fd.get('fam_pin')||'').trim(), own=String(fd.get('own_pin')||'').trim();
    if(fam===own){ toast('Family PIN and Owner PIN must be different'); return; }
    ['bride','groom','date','time','venue','hashtag','welcome'].forEach(k=>s[k]=String(fd.get(k)||'').trim());
    ['heroImg','portalImg'].forEach(k=>{ const v=String(fd.get(k)||'').trim(); if(v) s[k]=v; else if(!(s[k]||'').startsWith('data:')) s[k]=''; });
    a.family=fam; a.owner=own; a.budget=num(fd.get('side_budget')); a.share=!!fd.get('share');
    a.locks=a.locks||{}; a.pins=a.pins||{}; const missing=[];
    SECTIONS.forEach(([id,name])=>{ const m=String(fd.get('lock_'+id)||'open'), p=String(fd.get('pin_'+id)||'').trim();
      a.pins[id]=p; if(m==='pin' && !p){ a.locks[id]='owner'; missing.push(name); } else a.locks[id]=m; });
    save(); render();
    toast(missing.length?`Saved. ${missing.join(', ')} set to Owner only — add a password to use “Own password”.`:'Settings saved');
  }
}

document.addEventListener('input', e=>{
  if(!e.target.matches('[data-search]')) return;
  const q=e.target.value.toLowerCase(); const wrap=e.target.closest('.main').querySelector('.tablewrap'); if(!wrap) return;
  wrap.querySelectorAll('tbody tr').forEach(tr=>{ tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none'; });
});
$('#fileIn').addEventListener('change', e=>{ const file=e.target.files[0]; if(file) importFile(e.target.dataset.mod, file); });
$('#imgIn').addEventListener('change', e=>{ const file=e.target.files[0]; if(!file) return; readImage(file, url=>{ S.settings[e.target.dataset.k]=url; save(); render(); toast('Photo updated'); }); });
$('#jsonIn').addEventListener('change', e=>{ const file=e.target.files[0]; if(!file) return; const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d.settings) throw 0; S=normalise(d); save(); render(); toast('Backup restored'); }catch(_){ toast('That isn’t a valid backup file'); } }; fr.readAsText(file); });
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
window.addEventListener('hashchange', ()=>{ if(location.hash==='#guest' && role!=='guest') setRole('guest'); });

render();
if(role==='guest') setTimeout(popConfetti,400);
</script>
</body>
</html>
